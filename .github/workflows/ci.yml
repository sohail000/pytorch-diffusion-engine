name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install flake8
      - name: Lint
        run: flake8 *.py --max-line-length 120 --ignore E501,W503,E402
      - name: Verify imports
        run: |
          python -c "from clip import CLIP; print('CLIP OK')"
          python -c "from encoder import VAE_Encoder; print('Encoder OK')"
          python -c "from decoder import VAE_Decoder; print('Decoder OK')"
          python -c "from diffusion import Diffusion; print('Diffusion OK')"
          python -c "from ddpm import DDPMSampler; print('DDPM OK')"
          python -c "from ddim import DDIMSampler; print('DDIM OK')"
          python -c "from euler import EulerSampler; print('Euler OK')"
